name: Publish France routing pack

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/publish-routing-france.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: routing-france-2026-08-18
      SOURCE_RUN: "32157483664"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified routing artifact
        run: |
          mkdir -p release
          gh run download "$SOURCE_RUN" --name "OfflineWorldGPS-Routage-France" --dir release
          sha256sum --check release/SHA256SUMS-routing-france.txt

      - name: Ensure the tag is new
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace it."
            exit 1
          fi

      - name: Publish public routing download
        run: |
          gh release create "$TAG" \
            "release/OfflineWorldGPS-Routage-France.owgr.gz#Routage automobile France" \
            "release/SHA256SUMS-routing-france.txt#Somme de contrôle SHA-256" \
            --title "OfflineWorldGPS - Routage automobile France" \
            --notes "Pack routier automobile hors ligne pour OfflineWorldGPS V4.1. Données OpenStreetMap extraites par Geofabrik. Le fichier compressé fait environ 553 Mio et occupe environ 1,7 Gio après installation."
