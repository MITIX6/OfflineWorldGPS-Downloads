name: Build France routing pack

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/build_routing_pack.py"
      - "requirements-routing.txt"
      - ".github/workflows/build-routing-france.yml"

permissions:
  contents: read

concurrency:
  group: build-france-routing-pack
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free disk space for France
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-routing.txt

      - name: Install routing builder
        run: pip install -r requirements-routing.txt

      - name: Download current France OpenStreetMap extract
        run: |
          mkdir -p routing-work
          curl --fail --location --retry 5             https://download.geofabrik.de/europe/france-latest.osm.pbf             --output routing-work/france-latest.osm.pbf
          df -h /

      - name: Build compact car-routing graph
        run: |
          mkdir -p release
          python tools/build_routing_pack.py             --input routing-work/france-latest.osm.pbf             --output routing-work/OfflineWorldGPS-Routage-France.owgr             --gzip-output release/OfflineWorldGPS-Routage-France.owgr.gz
          sha256sum release/OfflineWorldGPS-Routage-France.owgr.gz             > release/SHA256SUMS-routing-france.txt
          ls -lh routing-work/OfflineWorldGPS-Routage-France.owgr release/*
          df -h /

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflineWorldGPS-Routage-France
          path: release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
