name: Build OfflineWorldGPS V4.9

on:
  push:
    branches:
      - offlineworldgps-v4-8
    paths:
      - "ci/source.part-*"
      - ".github/workflows/build-offlineworldgps-v49.yml"
  pull_request:
    branches:
      - main
    paths:
      - "ci/source.part-*"
      - ".github/workflows/build-offlineworldgps-v49.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"

      - name: Android SDK 34
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Extract V4.9 source
        run: |
          mkdir -p /tmp/offlineworldgps-v49
          cat ci/source.part-* > /tmp/OfflineWorldGPS-V4.9-Source.zip
          unzip -t /tmp/OfflineWorldGPS-V4.9-Source.zip
          unzip -q /tmp/OfflineWorldGPS-V4.9-Source.zip -d /tmp/offlineworldgps-v49

      - name: Build release APK
        working-directory: /tmp/offlineworldgps-v49/OfflineWorldGPS-V4.9-Source
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: Collect APK signing tools
        run: |
          mkdir -p deliverables
          cp /tmp/offlineworldgps-v49/OfflineWorldGPS-V4.9-Source/app/build/outputs/apk/release/app-release-unsigned.apk deliverables/OfflineWorldGPS-V4.9-unsigned.apk
          cp "$ANDROID_HOME/build-tools/34.0.0/lib/apksigner.jar" deliverables/apksigner.jar
          cp "$ANDROID_HOME/build-tools/34.0.0/zipalign" deliverables/zipalign
          chmod +x deliverables/zipalign

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflineWorldGPS-V4.9-unsigned
          path: deliverables/
          if-no-files-found: error
          retention-days: 7
